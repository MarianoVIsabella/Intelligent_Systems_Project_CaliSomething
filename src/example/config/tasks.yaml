categorization_task:
  description: >
    Analyze the article summary and classify the article into one main category:
    politics, health, science, economy, sports, technology, crime, entertainment, or general.

    Also identify important keywords, named entities, and emotional tone.
  expected_output: >
    The article category, keywords, named entities, and sentiment/tone.
  agent: categorizer_agent
evaluate_task:
  description: >
    Evaluate {news_text} about a certain topic. 
    Make use of your tools to research on Google also any RELEVANT information, given the current year is {current_year}.
    If you can't find any RELEVANT information after your research, conclude that the information is unverifiable.
    DON'T try to search news endlessly.
  expected_output: >
    The answer "yes" or "no" about the goodness of {news_text}, 
    coming with an explanation of why you think so, citing every website source (if any).
    Formatted as markdown.
  agent: domain_expert
  markdown: True
  output_file: outputs/expert_review.md

_verdict_task_common: &verdict
  expected_output: >
    Your verdict "True" or "Fake" about {news_text}, 
    coming with an explanation of why you think so.
    Formatted as markdown.
  expected_output: >
    Your verdict "True" or "Fake" about {news_text}, 
    coming with an explanation of why you think so.
    Formatted as markdown.

left_wing_verdict_task:
  context:
    - evaluate_task
  description: >
    Decide if {news_text} is real or no.
    Remember to consider the expert domain's opinion, but to base the decision also on your
    LEFT WING political views
  <<: *verdict
  agent: left_wing_judge
  output_file: outputs/left_verdict.md

right_wing_verdict_task:
  context:
    - evaluate_task
  description: >
    Decide if {news_text} is real or no.
    Remember to consider the expert domain's opinion, but to base the decision also on your
    RIGHT WING political views
  <<: *verdict
  agent: right_wing_judge
  output_file: outputs/right_verdict.md

neutral_verdict_task:
  description: >
    Decide if {news_text} is real or no.
    Remember to consider the expert domain's opinion, but to base the decision also on your opinion
  <<: *verdict
  agent: neutral_judge
  output_file: outputs/neutral_verdict.md

influenced_verdict_task:
  context:
    - evaluate_task
  description: >
    Decide if {news_text} is real or no, based entirely on what the domain's expert says.
  <<: *verdict
  agent: influenced_judge
  output_file: outputs/influenced_verdict.md

self_centered_verdict_task:
  context:
    - evaluate_task
  description: >
    Decide if {news_text} is real or no, based entirely on what's your opinion on it. Ignore what the domain expert says.
  <<: *verdict
  agent: self_centered_judge
  output_file: outputs/self_centered_verdict.md

decision_task:
  description: >
    Collect the opinion of every judge, counting yes and no to provide the final decision on {news_text}
    The judges are: Left Wing Judge, Right Wing Judge, Neutral Judge, 
    Influenced Judge, and Self Centered Judge.
    DO NOT consider any other source as a judge.
  expected_output: >
    A JSON object with:
    - final_verdict: "REAL", "FAKE", or "UNSURE"
    - judge_votes: a list of strings, one per judge (e.g. ["REAL", "FAKE", "REAL", "FAKE", "FAKE"])
    - reasoning: a brief explanation of which judge voted what and why
  agent: decision_agent
  markdown: True
  output_file: outputs/final_sentence.md