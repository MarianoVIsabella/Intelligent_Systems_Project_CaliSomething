categorization_task:
  description: >
    Analyze the following news:
    
    {news_text}

    Determine the categories involved in the news.

  expected_output: >
    A JSON object containing a list of categories.


expert_analysis_task:
  description: >
    Analyze the following news:

    {news_text}

    Verify whether the information appears reliable or suspicious.

  expected_output: >
    A JSON object containing an expert opinion about the credibility of the news.


judge_task:
  description: >
    Review the news, previous analyses, and expert opinion.

    Decide whether the news is:
    - REAL
    - FAKE
    - UNSURE

    Provide reasoning and judge votes.

  expected_output: >
    A JSON object containing:
    - final_verdict
    - judge_votes
    - reasoning