evaluate_task:
  description: >
    Evaluate {news} about {topic}. 
    Make use of your tools to research on Google also any interesting and relevant information, given the current year is {current_year}.
  expected_output: >
    The answer "yes" or "no" about the goodness of {news}, 
    coming with an explanation of why you think so, citing every website source (if any).
    Formatted as markdown.
  agent: domain_expert
  markdown: True
  output_file: output.md
