[project]
name = "example"
version = "0.1.0"
description = "example using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "duckduckgo-search>=8.1.1",
    "groq>=1.2.0",
    "lxml>=6.1.1",
    "newspaper3k>=0.2.8",
    "nltk>=3.9.4",
    "requests>=2.34.2",
    "spacy>=3.8.14",
    "torch>=2.12.0",
    "transformers>=5.9.0",
    "crewai-tools>=1.14.4",
    "crewai[tools]==1.14.4",
    "litellm>=1.84",
]

[project.scripts]
example = "example.main:run"
run_crew = "example.main:run"
train = "example.main:train"
replay = "example.main:replay"
test = "example.main:test"
run_with_trigger = "example.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
